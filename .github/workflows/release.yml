
name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Git tag and package.json version do not match"
          }

      - name: Check code quality
        run: npm run lint

      - name: Build React
        run: npm run build

      
      - name: Build NSIS locally
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Create one draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = node -p "require('./package.json').version"

          $installer = "release/Update-Lab-Setup-$version.exe"
          $metadata = "release/latest.yml"
          $blockmap = "$installer.blockmap"

          if (!(Test-Path $installer) -or !(Test-Path $metadata)) {
            throw "Missing installer or latest.yml"
          }

          if (!(Select-String -Path $metadata -Pattern "^version: $([regex]::Escape($version))$" -Quiet)) {
            throw "latest.yml version mismatch"
          }

          gh release view $env:RELEASE_TAG --json id 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release already exists: $env:RELEASE_TAG"
          }

          $assets = @($installer, $metadata)

          if (Test-Path $blockmap) {
            $assets += $blockmap
          }

          gh release create $env:RELEASE_TAG @assets `
            --draft `
            --verify-tag `
            --title "Update Lab $env:RELEASE_TAG" `
            --notes "Automated Windows x64 NSIS release."

          if ($LASTEXITCODE -ne 0) {
            throw "Release creation failed"
          }

